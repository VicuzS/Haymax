services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haymax}
      POSTGRES_USER: ${POSTGRES_USER:-haymax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haymax_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - haymax-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haymax} -d ${POSTGRES_DB:-haymax}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  haymax-postgres:
